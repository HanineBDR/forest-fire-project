services:
  - type: web
    name: in9ad-backend
    env: python
    region: frankfurt
    plan: free
    buildCommand: "pip install -r requirements.txt && python data/train_model.py"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.11
      - key: CORS_ORIGINS
        value: "*"
